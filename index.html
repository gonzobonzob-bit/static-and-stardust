<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="meta.title">Static &amp; Stardust — Coming Soon</title>
<meta name="description" data-i18n-content="meta.desc" content="Static &amp; Stardust — nostalgia, tuned to static. Bookmarks, coasters and charm necklaces. Our new home is coming soon.">
<meta name="theme-color" content="#0a0a12">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta property="og:title" content="Static & Stardust — Coming Soon">
<meta property="og:image" content="https://staticandstardust.com/assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<style>
  .cs{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 20px 32px;position:relative;z-index:1}
  .cs .badge{width:min(320px,70vw);height:auto;filter:drop-shadow(0 0 40px rgba(139,107,255,.35))}
  .cs h1{color:var(--ink);font-family:var(--display);font-size:clamp(34px,7vw,60px);line-height:1.1;margin:18px 0 8px}
  .cs .tag{color:var(--muted);font-size:clamp(15px,2.4vw,18px);max-width:520px;margin:0 auto 22px}
  .pill{display:inline-block;padding:8px 20px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--amber)}
  .photos{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:36px 0 12px}
  .photos img{width:min(260px,42vw);aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-card);border:1px solid var(--line)}
  .find{margin-top:20px;color:var(--faint);font-size:14px}
  .find a{color:var(--cyan);text-decoration:none;margin:0 6px}
  .find a:hover{text-decoration:underline}
  .lang-fixed{position:fixed;top:16px;right:16px;z-index:5}
  .copy{margin-top:36px;color:var(--faint);font-size:12px}
</style>
</head>
<body>
<div class="sky"></div>
<svg class="stars" aria-hidden="true"><defs><pattern id="s" width="140" height="140" patternUnits="userSpaceOnUse"><circle cx="12" cy="20" r="1" fill="#fff" opacity=".6"/><circle cx="80" cy="60" r="1.2" fill="#8b6bff" opacity=".7"/><circle cx="120" cy="110" r="1" fill="#4fd9e8" opacity=".6"/><circle cx="40" cy="100" r=".8" fill="#fff" opacity=".5"/></pattern></defs><rect width="100%" height="100%" fill="url(#s)"/></svg>
<div class="static-veil"></div>
<button class="lang-toggle lang-fixed" id="langToggle" type="button" aria-label="Español" lang="es">ES</button>

<main class="cs" id="top">
  <img class="badge" src="assets/logo-badge.png" alt="Static &amp; Stardust radio-tower sunset badge">
  <h1>Static<span class="amp" style="color:var(--pink)"> &amp; </span>Stardust</h1>
  <p class="tag" data-i18n="tag">Nostalgia, tuned to static.</p>
  <span class="pill" data-i18n="soon">Coming soon</span>
  <div class="photos">
    <img src="assets/bookmarks-space-dino.jpg" alt="Space and dinosaur laminated bookmarks with tassels" loading="lazy">
    <img src="assets/bookmarks-polar-bear.jpg" alt="Polar bear laminated bookmarks with tassels" loading="lazy">
  </div>
  <p class="find"><span data-i18n="find">Find us on</span>
    <a href="https://www.etsy.com/shop/StaticandStardust" rel="noopener">Etsy</a>·
    <a href="https://staticandstardust.myshopify.com" rel="noopener">Shopify</a>
  </p>
  <p class="copy">© <span id="year">2026</span> Static &amp; Stardust · El Paso, TX</p>
</main>

<script src="i18n.js"></script>
<script>
SASi18n({
  'meta.title':'Static &amp; Stardust — Próximamente',
  'meta.desc':'Static &amp; Stardust — nostalgia sintonizada en estática. Separadores de libros, posavasos y collares con dijes. Nuestro nuevo hogar llega pronto.',
  'tag':'Nostalgia, sintonizada en estática.',
  'soon':'Próximamente',
  'find':'Encuéntranos en'
});
</script>
</body>
</html>
